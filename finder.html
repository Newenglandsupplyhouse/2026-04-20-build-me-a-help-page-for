<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HVAC Parts &amp; Diagnostic Assistant</title>
  <style>
    :root {
      --bg: #08080b;
      --panel: #111117;
      --panel-2: #16161d;
      --border: #26262f;
      --text: #f5f5f7;
      --muted: #a6a8b3;
      --accent: #4f7cff;
      --accent-soft: #1b2340;
      --user-bubble: #2a2f45;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    main.chat {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 22px 0 8px;
      scroll-behavior: smooth;
    }

    .col {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 18px;
    }

    /* Welcome / empty state */
    .welcome { text-align: center; padding: 40px 0 8px; }
    .welcome h2 { font-size: 24px; margin: 0 0 10px; font-weight: 650; }
    .welcome p { color: var(--muted); font-size: 14.5px; line-height: 1.55; margin: 0 auto; max-width: 460px; }

    .suggestions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-top: 26px;
    }
    @media (max-width: 560px) { .suggestions { grid-template-columns: 1fr; } }
    .suggestions button {
      text-align: left; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 13px 14px; font-size: 13.5px; line-height: 1.4; cursor: pointer;
      transition: background .15s, border-color .15s, transform .05s;
    }
    .suggestions button:hover { background: var(--panel-2); border-color: #33333f; }
    .suggestions button:active { transform: translateY(1px); }
    .suggestions button span { color: var(--muted); display: block; font-size: 12px; margin-top: 3px; }

    /* Messages */
    .msg { display: flex; margin: 16px 0; gap: 10px; }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: var(--radius);
      font-size: 14.5px; line-height: 1.6;
      white-space: normal; word-wrap: break-word; overflow-wrap: anywhere;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 5px;
    }
    .msg.assistant .bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }
    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 8px 0; padding-left: 20px; }
    .bubble li { margin: 4px 0; }
    .bubble a { color: #8fb0ff; text-decoration: none; border-bottom: 1px solid #8fb0ff55; }
    .bubble a:hover { border-bottom-color: #8fb0ff; }
    .bubble strong { color: #fff; font-weight: 650; }

    .tools-note {
      max-width: 720px; margin: -6px auto 0; padding: 0 18px;
      font-size: 11.5px; color: #6d6f7a;
    }

    /* Typing indicator */
    .typing { display: inline-flex; gap: 5px; align-items: center; padding: 4px 2px; }
    .typing i {
      width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      animation: blink 1.3s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: .18s; }
    .typing i:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    /* Words appear as they arrive; the caret says "still writing" so a pause
       mid-reply doesn't read as a finished answer. */
    .bubble.streaming > :last-child::after {
      content: ""; display: inline-block; vertical-align: -1px;
      width: 7px; height: 14px; margin-left: 3px; border-radius: 1px;
      background: var(--muted); animation: blink 1.1s infinite ease-in-out;
    }
    .stream-note { color: var(--muted); font-size: 13px; }

    /* Composer */
    footer.composer {
      flex: 0 0 auto;
      border-top: 1px solid var(--border);
      background: linear-gradient(0deg, #0d0d12 0%, var(--bg) 100%);
      padding: 12px 0 8px;
    }
    .composer-row {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 8px 8px 8px 14px;
      transition: border-color .15s;
    }
    .composer-row:focus-within { border-color: #3a4a7a; }
    button#attach {
      flex: 0 0 auto; width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer;
      display: grid; place-items: center; font-size: 17px; transition: color .15s, border-color .15s;
    }
    button#attach:hover { color: var(--text); border-color: #3a3a46; }
    .attach-tray { display: flex; gap: 8px; padding: 0 0 8px; flex-wrap: wrap; }
    .attach-tray:empty { display: none; }
    .attach-chip { position: relative; width: 56px; height: 56px; border-radius: 9px; overflow: hidden; border: 1px solid var(--border); }
    .attach-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .attach-chip button {
      position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
      border: 0; background: #000c; color: #fff; font-size: 11px; line-height: 1; cursor: pointer;
    }
    .bubble .sent-photos { display: flex; gap: 6px; margin-top: 8px; }
    .bubble .sent-photos img { max-width: 120px; max-height: 120px; border-radius: 8px; border: 1px solid var(--border); }
    textarea#input {
      flex: 1 1 auto; resize: none; border: 0; outline: 0; background: transparent;
      color: var(--text); font-size: 14.5px; line-height: 1.5; font-family: inherit;
      max-height: 140px; padding: 6px 0;
    }
    textarea#input::placeholder { color: #61636e; }
    button#send {
      flex: 0 0 auto; width: 38px; height: 38px; border-radius: 10px;
      border: 0; background: var(--accent); color: #fff; cursor: pointer;
      display: grid; place-items: center; transition: background .15s, opacity .15s;
    }
    button#send:hover { background: #3c67e6; }
    button#send:disabled { opacity: .45; cursor: default; }
    button#send svg { width: 18px; height: 18px; }

    .footnote {
      text-align: center; font-size: 11px; color: #55565f; padding: 8px 0 2px;
    }
    .footnote a { color: #7f818c; text-decoration: none; }
    .footnote a:hover { color: var(--text); }
  </style>
</head>
<body>
  <main class="chat" id="chat">
    <div class="col" id="welcome">
      <div class="welcome">
        <h2>__CFG_HEADING__</h2>
        <p>__CFG_WELCOME__</p>
      </div>
      <div class="suggestions" id="suggestions">__CFG_CHIPS__</div>
    </div>
  </main>

  <footer class="composer">
    <div class="col">
      <div class="attach-tray" id="attach-tray"></div>
      <div class="composer-row">
        <button id="attach" type="button" aria-label="Attach a photo" title="Attach a photo (e.g. the part's nameplate)">📷</button>
        <input type="file" id="photo-input" accept="image/*" multiple style="display:none">
        <textarea id="input" rows="1" placeholder="__CFG_PLACEHOLDER__" autocomplete="off"></textarea>
        <button id="send" type="button" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
      <div class="footnote">
        AI can make mistakes — verify critical part numbers. Built by
        <a href="https://arcturus-consulting.com/" target="_blank" rel="noopener">Arcturus Consulting</a>.
      </div>
    </div>
  </footer>

  <script>
    (() => {
      "use strict";
      const chatEl = document.getElementById("chat");
      const welcomeEl = document.getElementById("welcome");
      const inputEl = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const suggestionsWrap = document.getElementById("suggestions");

      /** conversation history sent to the engine on every turn */
      let conversation = [];
      let busy = false;
      /** photos staged for the next message (downscaled JPEG data URLs, max 3) */
      let pendingImages = [];
      const attachBtn = document.getElementById("attach");
      const photoInput = document.getElementById("photo-input");
      const attachTray = document.getElementById("attach-tray");
      /** stable id so all turns of this visit group into one logged conversation.
          ?test=1 (admin "Test the agent" link) prefixes TEST- so the server skips CRM logging. */
      const isTest = new URLSearchParams(location.search).has("test");
      const sessionId = (isTest ? "TEST-" : "") + ((window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : `s-${Date.now()}-${Math.random().toString(16).slice(2)}`);

      // ---- lightweight, safe markdown rendering -------------------------
      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
      }

      function renderInline(text) {
        let t = escapeHtml(text);
        // [label](url)
        t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          (_m, label, url) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
        // bare urls not already inside an anchor
        t = t.replace(/(^|[\s(])((https?:\/\/[^\s<)]+))/g,
          (_m, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
        // **bold**
        t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        return t;
      }

      function renderMarkdown(md) {
        const lines = String(md).replace(/\r\n/g, "\n").split("\n");
        let html = "";
        let listType = null; // 'ul' | 'ol'
        let para = [];

        const flushPara = () => {
          if (para.length) { html += `<p>${para.join("<br>")}</p>`; para = []; }
        };
        const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };

        for (const raw of lines) {
          const line = raw.replace(/\s+$/, "");
          const bullet = line.match(/^\s*[-•*]\s+(.*)$/);
          const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);

          if (bullet) {
            flushPara();
            if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
            html += `<li>${renderInline(bullet[1])}</li>`;
          } else if (numbered) {
            flushPara();
            if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
            html += `<li>${renderInline(numbered[1])}</li>`;
          } else if (line.trim() === "") {
            flushPara(); closeList();
          } else {
            closeList();
            para.push(renderInline(line));
          }
        }
        flushPara(); closeList();
        return html || "<p></p>";
      }

      // ---- DOM helpers --------------------------------------------------
      function addMessage(role, contentHtml) {
        const wrap = document.createElement("div");
        wrap.className = `col`;
        const msg = document.createElement("div");
        msg.className = `msg ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = contentHtml;
        msg.appendChild(bubble);
        wrap.appendChild(msg);
        chatEl.appendChild(wrap);
        scrollToBottom();
        return bubble;
      }

      function addTyping() {
        const wrap = document.createElement("div");
        wrap.className = "col";
        wrap.dataset.typing = "1";
        wrap.innerHTML = `<div class="msg assistant"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`;
        chatEl.appendChild(wrap);
        scrollToBottom();
        return wrap;
      }

      function scrollToBottom() {
        requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
      }

      function setBusy(state) {
        busy = state;
        sendBtn.disabled = state;
      }

      // ---- photo attachments (nameplate shots) --------------------------
      function renderTray() {
        attachTray.innerHTML = "";
        pendingImages.forEach((src, i) => {
          const chip = document.createElement("div");
          chip.className = "attach-chip";
          chip.innerHTML = `<img src="${src}" alt="attached photo">`;
          const x = document.createElement("button");
          x.type = "button"; x.textContent = "✕"; x.ariaLabel = "Remove photo";
          x.onclick = () => { pendingImages.splice(i, 1); renderTray(); };
          chip.appendChild(x);
          attachTray.appendChild(chip);
        });
      }

      /** downscale to ≤1280px JPEG so nameplate photos stay readable but payloads stay small */
      function downscale(file) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => {
            URL.revokeObjectURL(url);
            const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.85));
          };
          img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
          img.src = url;
        });
      }

      attachBtn.addEventListener("click", () => photoInput.click());
      photoInput.addEventListener("change", async () => {
        for (const file of [...photoInput.files].slice(0, 3 - pendingImages.length)) {
          try { pendingImages.push(await downscale(file)); } catch { /* skip unreadable */ }
        }
        photoInput.value = "";
        renderTray();
        inputEl.focus();
      });

      // ---- send flow ----------------------------------------------------
      // Does this browser support reading a response body as it arrives? Old ones
      // fall back to the buffered JSON reply, which the server still returns.
      const canStream = typeof ReadableStream === "function"
        && typeof Response === "function"
        && !!Response.prototype
        && "body" in Response.prototype;

      // Minimal SSE frame parser — the endpoint sends "delta", then one "done"
      // carrying the final reply (prose plus any code-owned document block).
      async function readEventStream(res, onEvent) {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        for (;;) {
          const chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });

          let split;
          while ((split = buffer.indexOf("\n\n")) !== -1) {
            const frame = buffer.slice(0, split);
            buffer = buffer.slice(split + 2);

            let name = "message";
            const dataLines = [];
            for (const rawLine of frame.split("\n")) {
              const line = rawLine.replace(/\r$/, "");
              if (line.startsWith("event:")) name = line.slice(6).trim();
              else if (line.startsWith("data:")) dataLines.push(line.slice(5).replace(/^ /, ""));
            }
            if (!dataLines.length) continue; // ": open" keep-alive comment

            try {
              onEvent(name, JSON.parse(dataLines.join("\n")));
            } catch (err) {
              /* ignore a frame we can't parse rather than drop the whole reply */
            }
          }
        }
      }

      async function send(text) {
        const typed = (text != null ? text : inputEl.value).trim();
        const images = pendingImages.slice();
        if ((!typed && !images.length) || busy) return;
        const message = typed || "Here's a photo of my part — can you identify it?";

        if (welcomeEl) { welcomeEl.remove(); }
        inputEl.value = "";
        pendingImages = [];
        renderTray();
        autoGrow();

        const photosHtml = images.length
          ? `<div class="sent-photos">${images.map((s) => `<img src="${s}" alt="attached photo">`).join("")}</div>`
          : "";
        addMessage("user", escapeHtml(message).replace(/\n/g, "<br>") + photosHtml);
        conversation.push(images.length
          ? { role: "user", content: message, images }
          : { role: "user", content: message });

        setBusy(true);
        const typingEl = addTyping();

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": canStream ? "text/event-stream" : "application/json"
            },
            body: JSON.stringify({ conversation, sessionId, stream: canStream })
          });

          const streaming = res.ok
            && (res.headers.get("content-type") || "").indexOf("text/event-stream") !== -1;

          // Errors and rate-limit notices still come back as plain JSON, and so does
          // the whole reply if streaming wasn't negotiated.
          if (!streaming) {
            const data = await res.json().catch(() => ({}));
            typingEl.remove();

            if (!res.ok || data.error) {
              // surface friendly server-provided messages (e.g. rate-limit notices) when present
              const msg = (res.status === 429 && data.error)
                ? escapeHtml(data.error)
                : "Sorry — something went wrong reaching the assistant. Please try again in a moment.";
              addMessage("assistant", `<p>${msg}</p>`);
              // keep conversation consistent: drop the unanswered user turn
              conversation.pop();
              return;
            }

            const reply = data.reply || "No response.";
            addMessage("assistant", renderMarkdown(reply));
            conversation.push({ role: "assistant", content: reply });
            return;
          }

          let bubble = null;
          let streamed = "";
          let finalReply = "";
          let streamError = "";
          let repaint = null;

          const paint = () => {
            repaint = null;
            if (!bubble) return;
            bubble.innerHTML = renderMarkdown(streamed);
            scrollToBottom();
          };

          try {
            await readEventStream(res, (name, data) => {
              if (name === "delta" && data && typeof data.text === "string") {
                if (!bubble) {
                  typingEl.remove();
                  bubble = addMessage("assistant", "");
                  bubble.classList.add("streaming");
                }
                streamed += data.text;
                // Deltas land far faster than anyone reads; repainting on a short
                // timer keeps the text flowing without re-rendering per token.
                if (!repaint) repaint = setTimeout(paint, 60);
              } else if (name === "done" && data) {
                finalReply = data.reply || "";
              } else if (name === "error" && data) {
                streamError = data.error || "stream error";
              }
            });
          } catch (err) {
            // Connection dropped part-way; whatever already arrived is kept below.
            streamError = "connection lost";
          }

          if (repaint) { clearTimeout(repaint); }
          typingEl.remove();

          // The server's final reply is authoritative — it carries the document block
          // that code appends after the prose, which never came through as deltas.
          const answer = finalReply || streamed;

          if (answer) {
            if (!bubble) bubble = addMessage("assistant", "");
            bubble.classList.remove("streaming");
            bubble.innerHTML = renderMarkdown(answer)
              + (finalReply ? "" : `<p class="stream-note">That reply was cut off — please ask again.</p>`);
            scrollToBottom();
            conversation.push({ role: "assistant", content: answer });
            return;
          }

          // Failed before a single word landed: nothing for the customer to keep.
          addMessage("assistant", streamError
            ? `<p>Sorry — something went wrong reaching the assistant. Please try again in a moment.</p>`
            : `<p>No response.</p>`);
          conversation.pop();
        } catch (err) {
          typingEl.remove();
          addMessage("assistant",
            `<p>Network hiccup — I couldn't reach the assistant. Please try again.</p>`);
          conversation.pop();
        } finally {
          setBusy(false);
          inputEl.focus();
        }
      }

      // ---- input behaviour ---------------------------------------------
      function autoGrow() {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
      }

      inputEl.addEventListener("input", autoGrow);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      sendBtn.addEventListener("click", () => send());

      if (suggestionsWrap) {
        suggestionsWrap.addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-q]");
          if (btn) { send(btn.getAttribute("data-q")); }
        });
      }

      inputEl.focus();
    })();
  </script>
</body>
</html>
